services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinica
      POSTGRES_USER: clinica
      POSTGRES_PASSWORD: clinica
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinica -d clinica"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Migración + datos de prueba (se ejecuta una sola vez)
  migrate:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment: &dbenv
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: clinica
      DB_USER: clinica
      DB_PASS: clinica
    command: php /var/www/html/database/migrate.php

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *dbenv
      APP_NAME: "Clínica VidaSalud"
    ports:
      - "8080:80"

volumes:
  pgdata:
